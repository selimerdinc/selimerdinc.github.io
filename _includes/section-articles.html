<style>
  .articles-premium {
    max-width: 1100px;
    margin: 0 auto;
  }

  .articles-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 25px;
  }

  .project-card {
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
    border-radius: 20px;
    padding: 28px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    min-height: 280px;
  }

  .project-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    border-color: rgba(255, 7, 58, 0.3);
  }

  .project-header {
    display: flex;
    align-items: flex-start;
    gap: 15px;
    margin-bottom: 18px;
  }

  .project-icon {
    font-size: 2.2rem;
    line-height: 1;
  }

  .project-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.4;
    flex: 1;
  }

  .project-description {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.7;
    margin-bottom: 20px;
    flex: 1;
  }

  .project-date {
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 12px;
  }

  .project-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .project-tag {
    background: rgba(255, 7, 58, 0.12);
    color: #ff073a;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .project-links {
    display: flex;
    gap: 12px;
    margin-top: auto;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .project-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .project-link.medium {
    background: linear-gradient(135deg, #ff073a 0%, #ff3d5a 100%);
    color: #fff;
  }

  .project-link.medium:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255, 7, 58, 0.4);
  }

  .project-link svg {
    width: 16px;
    height: 16px;
  }

  /* Loading state */
  .articles-loading {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255, 255, 255, 0.6);
  }

  .loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: #ff073a;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* Skeleton loading */
  .skeleton-card {
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
    border-radius: 20px;
    padding: 28px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    min-height: 280px;
  }

  .skeleton-line {
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.05) 25%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.05) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  .skeleton-title {
    height: 24px;
    width: 80%;
  }

  .skeleton-text {
    height: 14px;
    width: 100%;
  }

  .skeleton-text-short {
    height: 14px;
    width: 60%;
  }

  @keyframes shimmer {
    0% {
      background-position: 200% 0;
    }

    100% {
      background-position: -200% 0;
    }
  }
</style>

<div class="articles-premium">
  <div class="articles-header">
    <h1 class="title"><span>Makaleler</span></h1>
    <p style="color: rgba(255,255,255,0.6); margin-top: 10px;">Medium'daki son teknik yazılarım</p>
  </div>

  <div class="projects-grid" id="medium-articles">
    <!-- Loading skeletons -->
    <div class="skeleton-card">
      <div class="skeleton-line skeleton-title"></div>
      <div class="skeleton-line skeleton-text"></div>
      <div class="skeleton-line skeleton-text"></div>
      <div class="skeleton-line skeleton-text-short"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-line skeleton-title"></div>
      <div class="skeleton-line skeleton-text"></div>
      <div class="skeleton-line skeleton-text"></div>
      <div class="skeleton-line skeleton-text-short"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-line skeleton-title"></div>
      <div class="skeleton-line skeleton-text"></div>
      <div class="skeleton-line skeleton-text"></div>
      <div class="skeleton-line skeleton-text-short"></div>
    </div>
  </div>
</div>

<script>
  (function () {
    const MEDIUM_USERNAME = 'selimerdinc';
    const RSS_URL = `https://api.rss2json.com/v1/api.json?rss_url=https://medium.com/feed/@${MEDIUM_USERNAME}`;
    const ARTICLE_COUNT = 9;
    const container = document.getElementById('medium-articles');

    function formatDate(dateString) {
      const date = new Date(dateString);
      const months = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran',
        'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
      return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || '';
    }

    function truncateText(text, maxLength) {
      if (text.length <= maxLength) return text;
      return text.substr(0, maxLength).trim() + '...';
    }

    function extractTags(categories) {
      if (!categories || categories.length === 0) return [];
      return categories.slice(0, 3);
    }

    function renderArticles(articles) {
      if (!articles || articles.length === 0) {
        container.innerHTML = '<p class="articles-loading">Makale bulunamadı.</p>';
        return;
      }

      const html = articles.map((article, index) => {
        const description = truncateText(stripHtml(article.description), 150);
        const tags = extractTags(article.categories);
        const date = formatDate(article.pubDate);

        return `
        <div class="project-card" data-aos="fade-up" data-aos-delay="${index * 50}">
          <div class="project-header">
            <span class="project-icon">📝</span>
            <h3 class="project-title">${article.title}</h3>
          </div>
          <p class="project-date">📅 ${date}</p>
          <p class="project-description">${description}</p>
          ${tags.length > 0 ? `
            <div class="project-tags">
              ${tags.map(tag => `<span class="project-tag">${tag}</span>`).join('')}
            </div>
          ` : ''}
          <div class="project-links">
            <a href="${article.link}" target="_blank" rel="noreferrer" class="project-link medium">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M13.54 12a6.8 6.8 0 01-6.77 6.82A6.8 6.8 0 010 12a6.8 6.8 0 016.77-6.82A6.8 6.8 0 0113.54 12z"/>
              </svg>
              Makaleyi Oku
            </a>
          </div>
        </div>
      `;
      }).join('');

      container.innerHTML = html;

      // Re-initialize AOS for new elements
      if (typeof AOS !== 'undefined') {
        AOS.refresh();
      }
    }

    function showError() {
      container.innerHTML = `
      <p class="articles-loading">
        Makaleler yüklenirken bir hata oluştu.<br>
        <a href="https://medium.com/@${MEDIUM_USERNAME}" target="_blank" style="color: #ff073a;">
          Medium profilimi ziyaret edin →
        </a>
      </p>
    `;
    }

    // Fetch articles
    fetch(RSS_URL)
      .then(response => {
        if (!response.ok) throw new Error('Network error');
        return response.json();
      })
      .then(data => {
        if (data.status !== 'ok') throw new Error('RSS error');
        const articles = data.items.slice(0, ARTICLE_COUNT);
        renderArticles(articles);
      })
      .catch(error => {
        console.error('Medium fetch error:', error);
        showError();
      });
  })();
</script>
