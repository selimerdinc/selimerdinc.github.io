    function formatDate(dateString) {
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return dateString;
      const months = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran',
        'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
      return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || '';
    }

    function truncateText(text, maxLength) {
      if (!text) return '';
      if (text.length <= maxLength) return text;
      return text.substr(0, maxLength).trim() + '...';
    }

    function extractTags(categories) {
      if (!categories || categories.length === 0) return [];
      return categories.slice(0, 3);
    }

    function renderArticles(articles) {
      if (!articles || articles.length === 0) {
        return;
      }

      const html = articles.map((article, index) => {
        const description = truncateText(stripHtml(article.description), 150);
        const tags = extractTags(article.categories);
        const date = formatDate(article.pubDate);

        return `
        <div class="project-card" data-aos="fade-up" data-aos-delay="${index * 50}">
          <div class="project-header">
            <span class="project-icon">📝</span>
            <h3 class="project-title">${article.title}</h3>
          </div>
          <p class="project-date">📅 ${date}</p>
          <p class="project-description">${description}</p>
          ${tags.length > 0 ? `
            <div class="project-tags">
              ${tags.map(tag => `<span class="project-tag">${tag}</span>`).join('')}
            </div>
          ` : ''}
          <div class="project-links">
            <a href="${article.link}" target="_blank" rel="noreferrer" class="project-link medium">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M13.54 12a6.8 6.8 0 01-6.77 6.82A6.8 6.8 0 010 12a6.8 6.8 0 016.77-6.82A6.8 6.8 0 0113.54 12z"/>
              </svg>
              Makaleyi Oku
            </a>
          </div>
        </div>
      `;
      }).join('');

      container.innerHTML = html;

      if (typeof AOS !== 'undefined') {
        AOS.refresh();
      }
    }

    // Render immediately with pre-cached articles (no delay, no Cloudflare error)
    renderArticles(FALLBACK_ARTICLES);

    // Try fetching fresh feed in the background
    const RSS_URL = `https://api.rss2json.com/v1/api.json?rss_url=https://medium.com/feed/@${MEDIUM_USERNAME}`;
    fetch(RSS_URL, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('Network error');
        return response.json();
      })
      .then(data => {
        if (data && data.status === 'ok' && Array.isArray(data.items) && data.items.length > 0) {
          renderArticles(data.items.slice(0, ARTICLE_COUNT));
        }
      })
      .catch(() => {
        // Quietly keep displaying fallback articles
      });
